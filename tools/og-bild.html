<!doctype html>
<!--
  Vorschaubild für Links (Open Graph), 1200 × 630 px.
  In Chromium bei 1200 × 630 öffnen und fotografieren, z. B. mit Playwright:
    page.setViewportSize({width:1200, height:630}); page.goto('file://…/tools/og-bild.html'); page.screenshot(…)
  Danach als JPEG (Qualität 86) unter neuem Namen in assets/img/ speichern und
  og:image in allen 9 HTML-Dateien sowie "image" im JSON-LD der Startseite anpassen.
-->
<html lang="de"><head><meta charset="utf-8"><style>
@font-face{font-family:"Noto Sans";font-weight:100 900;src:url("../assets/fonts/noto-sans-v42-latin.woff2") format("woff2")}
*{margin:0;box-sizing:border-box}body{width:1200px;height:630px;font-family:"Noto Sans";overflow:hidden;position:relative;background:#eef2f4}
img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:70% 50%}
.s{position:absolute;left:56px;bottom:56px;width:404px;height:404px;background:#005ca8;color:#fff;padding:30px 34px 34px;display:flex;flex-direction:column;justify-content:space-between;border-radius:3px}
.b{font-size:30px;font-weight:600}.c{font-size:56px;font-weight:700;line-height:1.02;letter-spacing:-.03em}.c span{display:block}
.u{position:absolute;right:48px;bottom:44px;font-size:24px;font-weight:600;color:#10263d;background:#fff;padding:10px 16px;border-radius:2px}
</style></head><body><img src="originals/hero-grau.jpg" alt=""><div class="s"><p class="b">raumrent –</p><p class="c"><span>flexibel &amp;</span><span>temporär</span></p></div><p class="u">raumrent.de</p></body></html>
